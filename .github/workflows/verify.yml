name: 校验

# 每次 push / PR 都跑的只读校验，**不联网**。
#
# 它拦的是三类「装的时候才发现」的问题：
#   ① 改了 plugins/<id>/plugin.json 却忘了重跑 build-manifest.mjs ——
#      市场读的是 manifest.json，它过期就意味着市场看到的版本/tarball 是旧的
#   ② 覆盖了已发布版本的 tarball —— sha256 对不上，用户拿到的字节和记录的不是同一个
#   ③ 快照与 plugins/ 下的同名 tarball 字节不一致 —— 快照的意义就是「同一个字节」

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    name: 清单与字节完整性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'

      - name: manifest.json 与各插件配置一致
        run: node scripts/build-manifest.mjs --check

      - name: 每个插件都有一份 plugin.json 与 README
        run: |
          set -euo pipefail
          fail=0
          for dir in plugins/*/; do
            id=$(basename "$dir")
            [ -f "$dir/plugin.json" ] || { echo "::error::$id 缺少 plugin.json"; fail=1; }
            [ -f "$dir/README.md" ]  || { echo "::error::$id 缺少 README.md（每个插件都要写明安装方法）"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "每个插件都有 plugin.json 与 README.md。"

      - name: tarball 与快照逐字节一致，且 sha256 与清单相符
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const sha = (f) => crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          let bad = 0;
          for (const p of m.plugins) {
            for (const v of p.versions) {
              if (!fs.existsSync(v.tarball)) { console.log(`::error::缺少 tarball ${v.tarball}`); bad++; continue; }
              const actual = sha(v.tarball);
              if (actual !== v.sha256) { console.log(`::error::${v.tarball} 的 sha256 与 manifest 不符`); bad++; }
              if (v.snapshot) {
                if (!fs.existsSync(v.snapshot)) { console.log(`::error::缺少快照 ${v.snapshot}`); bad++; }
                else if (sha(v.snapshot) !== actual) { console.log(`::error::快照与 tarball 字节不一致：${v.snapshot}`); bad++; }
              }
            }
          }
          if (bad) process.exit(1);
          console.log(`校验通过：${m.counts.total} 个插件，${m.counts.versions} 个版本，tarball 与快照逐字节一致。`);
          NODE
